name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    strategy:
      matrix:
        python: ['3.9', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python bridge_core.py --self-test
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_tree.py
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./menu/build.sh
  windows-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Windows core and native transport tests
        env:
          PYTHONUTF8: '1'
        run: |
          $failed = $false
          python bridge_core.py --self-test
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          python scripts/check_public_tree.py
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Build and smoke-test native Windows distribution
        env:
          PYTHONUTF8: '1'
        run: python scripts/package_windows.py
